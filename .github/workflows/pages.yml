name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js && node --check capture-format.js && node --check policy.js && node --check cloud.js && node --check cloud-ui.js && node --check share.js && node --check share-ui.js && node test.cjs && node capture-format.test.cjs && node cloud.test.cjs && node unlock.test.cjs && node share.test.cjs && node --check receive-share.js && node receive-share.test.cjs
      - run: mkdir _site && cp index.html style.css app.js capture-format.js policy.js cloud.js cloud-ui.js firebase-config.js unlock-key.js unlock-config.js share.js share-ui.js receive-share.js sw.js manifest.webmanifest _site/ && cp -r shares icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
